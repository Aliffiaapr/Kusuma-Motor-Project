<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Reservasi Servis - Kusuma Motors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-container">
        <!-- Header Halaman -->
        <header class="header">
            <h1>Kusuma Motors</h1>
            <p>Formulir Reservasi Servis Digital</p>
        </header>

        <!-- Form Reservasi -->
        <form id="formReservasi">
            
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" placeholder="Masukkan nama Anda" required>
            </div>

            <div class="form-group">
                <label for="whatsapp">Nomor WhatsApp</label>
                <input type="tel" id="whatsapp" placeholder="Contoh: 08123456789" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="platNomor">Plat Nomor</label>
                    <input type="text" id="platNomor" placeholder="H 1234 AB" class="uppercase" required>
                </div>
                <div class="form-group">
                    <label for="jenisMobil">Jenis Mobil</label>
                    <input type="text" id="jenisMobil" placeholder="Avanza / Brio" required>
                </div>
            </div>

            <!-- 1. PILIH LAYANAN TERLEBIH DAHULU -->
            <div class="form-group">
                <label for="layanan">Pilih Layanan</label>
                <select id="layanan" required>
                    <option value="Home Service">Home Service (Servis di Rumah - H+1)</option>
                    <option value="On-Site">On-Site (Datang ke Bengkel)</option>
                </select>
            </div>

            <!-- Fitur Location-Based Service (GPS) -->
            <div id="sectionLokasi" class="lokasi-box">
                <label>Lokasi Home Service (GPS):</label>
                <button type="button" id="btnLokasi" class="btn-secondary">
                    📍 Ambil Titik Lokasi Saya
                </button>
                <p id="statusLokasi">Lokasi belum diambil</p>
            </div>

            <!-- 2. TANGGAL DAN JAM SERVIS (MENYESUAIKAN DENGAN LAYANAN) -->
            <div class="form-row">
                <div class="form-group">
                    <label for="tanggalReservasi">Tanggal Servis</label>
                    <input type="date" id="tanggalReservasi" required>
                </div>
                <div class="form-group">
                    <label for="jamServis">Jam Servis</label>
                    <select id="jamServis" required>
                        <option value="">-- Pilih Jam --</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="keluhan">Catatan Servis / Keluhan</label>
                <textarea id="keluhan" rows="3" placeholder="Jelaskan keluhan mobil Anda..."></textarea>
            </div>

            <button type="submit" id="btnSubmit" class="btn-primary">
                Kirim Reservasi Sekarang
            </button>
        </form>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
